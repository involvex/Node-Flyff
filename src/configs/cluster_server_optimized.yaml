server:
  host: "127.0.0.1"
  port: 28000
security:
  master-password: "StrongPassword"
settings:
  name: "Node-Flyff"
  login-protect: true
  world-server:
    host: "127.0.0.1"
    port: 5401
  maps:
    - WI_WORLD_MADRIGAL
    - WI_DUNGEON_FL_MAS
  rates:
    experience: 1
    drop: 1
    gold: 1
  death-penalty-enabled: true
  mails:
    shipping-cost: 500
  messenger:
    maximum-friends: 100
  customization:
    face-cost: 1000000
    hair-cost: 2000000
    hair-color-cost: 4000000
  drops:
    ownership-time: 7
    despawn-time: 120
  default-character:
    level: 1
    gold: 0
    strength: 15
    stamina: 15
    dexterity: 15
    intelligence: 15
    map: 1
    pos-x: 6968
    pos-y: 100
    pos-z: 3328
    equipped:
      male:
        hat:
        body: II_ARM_M_VAG_SUIT01
        hand: II_ARM_M_VAG_GAUNTLET01
        boots: II_ARM_M_VAG_BOOTS01
        right-weapon: II_WEA_SWO_WOODEN
        left-weapon:
      female:
        hat:
        body: II_ARM_F_VAG_SUIT01
        hand: II_ARM_F_VAG_GAUNTLET01
        boots: II_ARM_F_VAG_BOOTS01
        right-weapon: II_WEA_SWO_WOODEN
        left-weapon:
    inventory: []
# Inter-server communication (replaces Redis)
inter-server:
  enabled: true
  host: "127.0.0.1"
  port: 28001
  login-server:
    host: "127.0.0.1"
    port: 23001
  world-servers:
    - host: "127.0.0.1"
      port: 5401
      name: "Channel 1"
# Database configuration (Bun SQLite optimized)
database:
  provider: "sqlite"
  database: "data/flyff.db"
  synchronize: true
  logging: false
# Session management (in-memory, replaces Redis)
sessions:
  default-duration: 3600
  cleanup-interval: 60
# Asset configuration
assets:
  client-path: "I:\\ClockworksFlyff Client\\"
  cache-path: "data/assets/"
  enable-caching: true
